[package]
name = "bmdb-kernel"
version.workspace = true
edition.workspace = true

# The default test/bench harnesses pull in std, which is unavailable on bare metal.
[[bin]]
name = "bmdb"
path = "src/main.rs"
test = false
bench = false

[features]
# `bench` swaps the crash-recovery gate for a latency microbench that puts
# then reads, and prints TSC-cycle stats over the serial line.
bench = []
# `silo-bench` drives a concurrent Silo OCC workload across every AP and
# a group-commit persist on the BSP. Mutually exclusive with `bench`.
silo-bench = []

[dependencies]
bootloader.workspace = true
x86_64.workspace = true
lazy_static.workspace = true
bmdb-core.workspace = true
bmdb-serial.workspace = true
bmdb-pci.workspace = true
bmdb-nvme.workspace = true

# QEMU flags used by `bootimage runner` when `cargo run`.
# -display none keeps it headless; -serial stdio routes COM1 to the terminal.
# The NVMe device is backed by nvme.img (created with `qemu-img create -f raw nvme.img 128M`).
[package.metadata.bootimage]
run-args = [
    "-serial", "stdio",
    "-display", "none",
    "-smp", "4",
    # KVM + host CPU passthrough. The silo-bench numbers without this
    # flag carry a ~17x TCG emulation penalty that drowns OCC hot
    # paths — keep it on by default. Requires `/dev/kvm` access; if
    # `Could not access KVM kernel module: Permission denied` fires,
    # `sudo usermod -aG kvm $USER` then log out and back in.
    "-enable-kvm", "-cpu", "host",
    "-drive", "file=nvme.img,format=raw,if=none,id=nvme0",
    "-device", "nvme,serial=BMDB0001,drive=nvme0",
]
