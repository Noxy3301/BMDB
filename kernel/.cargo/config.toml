# Bare-metal builds from inside `kernel/` default to the built-in
# x86_64-unknown-none target (prebuilt core + compiler_builtins with mem
# intrinsics — no build-std, no custom target JSON needed since the move
# to bootloader 0.11). Disk images and QEMU runs go through the
# `hw-runner` tool at the workspace root: `cargo krun`.

[build]
target = "x86_64-unknown-none"
