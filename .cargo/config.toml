# Root config. The kernel builds against the built-in
# `x86_64-unknown-none` target (no build-std, no custom JSON); disk
# images (BIOS + UEFI + PXE/TFTP) are produced host-side by
# `tools/hw-runner` via the bootloader 0.11 builder API, which also
# spawns QEMU. Host unit tests stay on the default host target.

[alias]
# Build the bare-metal kernel ELF.
kbuild = ["build", "--target", "x86_64-unknown-none", "-p", "bmdb-kernel"]

# Build + boot under QEMU (BIOS image by default; pass --uefi for OVMF).
krun = ["run", "-p", "hw-runner", "--", "qemu"]

# Latency microbench / concurrent Silo OCC workload under QEMU.
kbench = ["run", "-p", "hw-runner", "--", "qemu", "--features", "bench"]
ksilobench = ["run", "-p", "hw-runner", "--", "qemu", "--features", "silo-bench"]
# Concurrent transactions through the lock-free B+tree index under QEMU.
kenginebench = ["run", "-p", "hw-runner", "--", "qemu", "--features", "engine-bench"]
# YCSB A/B/C scaling of the index on a warm tree (QEMU = correctness only).
kycsbbench = ["run", "-p", "hw-runner", "--", "qemu", "--features", "ycsb-bench"]

# Host-side unit tests for the pure-logic `core` crate.
ctest = ["test", "--target", "x86_64-unknown-linux-gnu", "-p", "bmdb-core"]
