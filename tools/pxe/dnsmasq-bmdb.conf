# dnsmasq config for BMDB real-hardware PXE boot.
#
# Runs as a proxy-DHCP + TFTP server ONLY: the LAN's existing router
# (NEC Aterm at 192.168.0.1) stays the real DHCP server and hands out
# leases; dnsmasq just adds the PXE boot info for UEFI x86-64 clients.
# It never assigns addresses and never answers DNS.
#
# Run it foreground for a test session (needs root for ports 67/69/4011):
#   sudo dnsmasq --no-daemon --conf-file=tools/pxe/dnsmasq-bmdb.conf
# Ctrl-C stops it. See tools/pxe/README.md for the full runbook.

# No DNS — avoids colliding with systemd-resolved on :53.
port=0

# Only serve on the wired LAN facing the M920q.
interface=eno2
bind-interfaces

# Proxy-DHCP: the router allocates IPs; we only supply PXE boot info.
dhcp-range=192.168.0.0,proxy

# Serve the boot files over TFTP from the deploy root.
enable-tftp
tftp-root=/srv/tftp

# The bootloader 0.11 UEFI stage is emitted as the file "bootloader";
# the DHCP boot filename must point at exactly that name.
#
# RFC 4578 client-arch (DHCP option 93): 6 = IA32 UEFI, 7 = UEFI byte
# code, 9 = x86-64 UEFI. Real firmware varies in which it sends, so all
# three are offered. proxy-DHCP honours pxe-service (option 43), not
# dhcp-boot. After the first boot, `--log-dhcp` shows the arch the
# M920q actually sent — prune the unused lines then.
pxe-service=6,"BMDB PXE",bootloader
pxe-service=7,"BMDB PXE",bootloader
pxe-service=9,"BMDB PXE",bootloader

# Log every DHCP/proxy decision and TFTP transfer so a failed boot is
# diagnosable from the server side (which is the only side with output
# until BMDB's own kernel starts talking on the AMT serial console).
log-dhcp
