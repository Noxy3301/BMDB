[package]
name = "bmdb-kernel"
version.workspace = true
edition.workspace = true

# The default test/bench harnesses pull in std, which is unavailable on bare metal.
[[bin]]
name = "bmdb"
path = "src/main.rs"
test = false
bench = false

[features]
# `bench` swaps the crash-recovery gate for a latency microbench that puts
# then reads, and prints TSC-cycle stats over the serial line.
bench = []
# `silo-bench` drives a concurrent Silo OCC workload across every AP and
# a group-commit persist on the BSP. Mutually exclusive with `bench`.
silo-bench = []
# `engine-bench` drives full key-addressable transactions through the
# lock-free concurrent B+tree index across every AP, measuring end-to-end
# OCC + index throughput. Mutually exclusive with `bench` / `silo-bench`.
engine-bench = []
# `ycsb-bench` measures YCSB A/B/C scaling of the concurrent index on a warm
# tree over a fenced deadline window, one worker per core. The authoritative
# bare-metal scaling surface. Mutually exclusive with the other benches.
ycsb-bench = []
# `hw-loop` builds the unattended real-hardware test image: it brackets
# the durability gate with a boot counter and raw-block / WAL probes, then
# self-resets to run the next PXE image (AMT can't reset a box this
# driverless OS is running). Off for a normal kernel, which just halts.
hw-loop = []

[dependencies]
bootloader_api.workspace = true
x86_64.workspace = true
lazy_static.workspace = true
bmdb-core.workspace = true
bmdb-serial.workspace = true
bmdb-pci.workspace = true
bmdb-nvme.workspace = true
