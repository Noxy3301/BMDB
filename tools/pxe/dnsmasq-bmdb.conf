# dnsmasq config for BMDB real-hardware PXE boot.
#
# Serves a FULL DHCP lease to the M920q only (matched by MAC); every
# other client on the LAN is ignored, so the existing router (NEC Aterm
# at 192.168.0.1) keeps serving the rest of the network untouched.
#
# Why not proxy-DHCP? bootloader 0.11's UEFI stage reads the kernel's
# TFTP server from the DHCP ACK's siaddr field (bootp_si_addr) and does
# NOT merge a separate proxy-DHCP offer. Under proxy-DHCP the real lease
# comes from the router with siaddr=0.0.0.0, so the bootloader tries to
# TFTP the kernel from 0.0.0.0 and panics "Failed to load kernel". By
# answering the M920q's DHCP ourselves we put this host in siaddr.
#
# Run it foreground for a test session (needs root for ports 67/69):
#   sudo dnsmasq --no-daemon --conf-file=tools/pxe/dnsmasq-bmdb.conf
# Ctrl-C stops it. See tools/pxe/README.md for the full runbook.

# No DNS — avoids colliding with systemd-resolved on :53.
port=0

# Only serve on the wired LAN facing the M920q.
interface=eno2
bind-interfaces

# A one-address pool makes dnsmasq an authoritative DHCP server on the
# subnet; dhcp-ignore below restricts it to the single known host.
dhcp-range=192.168.0.240,192.168.0.240,255.255.255.0,1h

# Pin the M920q (its onboard NIC shares the AMT MAC) to a fixed address
# and mark it "known". Serve nobody else.
dhcp-host=00:2b:67:0b:7d:0e,192.168.0.240,m920q
dhcp-ignore=tag:!known

# Serve the boot files over TFTP from the deploy root.
enable-tftp
tftp-root=/srv/tftp

# UEFI x86-64 network boot: hand the bootloader NBP as the boot filename
# and set the next-server (siaddr) to this host, so the bootloader's own
# TFTP fetch of "kernel-x86_64" has a valid server to talk to.
dhcp-boot=bootloader,bmdb,192.168.0.222

# Log every DHCP/proxy decision and TFTP transfer so a failed boot is
# diagnosable from the server side (the only side with output until
# BMDB's own kernel starts talking on the AMT serial console).
log-dhcp
